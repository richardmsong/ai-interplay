[project]
name = "ai-interplay"
version = "0.1.0"
description = "Research: Hybrid LLM + Traditional AI multi-agent systems vs pure LLM systems on numeric tasks"
requires-python = ">=3.11"
dependencies = [
    # Phase 0: Tokenizer round-trip
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pandas>=2.2",
    "transformers>=4.40",       # Llama-3, Mistral tokenizers
    "tiktoken>=0.7",            # GPT-4o tokenizer
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
phase1 = [
    "torch>=2.2",
    "vllm>=0.4",
    "openai>=1.0",              # vLLM-compatible client
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]
phase2 = [
    "statsmodels>=0.14",
    "prophet>=1.1",
    "autogluon>=1.0",
    "pytorch-lightning>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
